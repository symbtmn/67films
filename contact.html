<header id="main-header">
  <div class="top-bar">

  <nav class="nav-bar">

<main class="container">
  <h2 class="page-title" style="text-align: center;">Кері байланыс (Фильм ұсыну)</h2>

  <form id="contact-form">
    <label for="username">Атыңыз:</label>
    <input type="text" id="username" required placeholder="Есіміңіз">

    <label for="email">Электронды пошта:</label>
    <input type="email" id="email" required placeholder="email@example.com">

    <label for="category">Санат:</label>
    <select id="category">
      <option value="Фильм ұсыну">Фильм ұсыну</option>
      <option value="Қателік туралы">Қателік туралы хабарлау</option>
    </select>

    <label for="message">Хабарлама:</label>
    <textarea id="message" rows="4" required></textarea>

    <button type="submit">Жіберу және Excel-ге сақтау</button>
  </form>
</main>

<footer>
