<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>67Films responsive QA</title><style>body{margin:0;padding:16px;background:#e8e8e8;color:#151515;font:14px system-ui}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}button,select{font:inherit;padding:8px 12px}button[aria-pressed=true]{background:#b71c1c;color:white;border:2px solid #b71c1c}iframe{display:block;border:1px solid #666;margin-inline:auto;background:white;width:375px;height:850px}h1{font-size:18px;margin:0}#frameWidth{font-variant-numeric:tabular-nums}</style></head><body><header><h1>67Films · responsive QA</h1><label>Page <select id="testPage"><option value="index.html">Home</option><option value="jquery.html">Catalogue</option><option value="discover.html">API</option><option value="signup.html">Sign up</option><option value="login.html">Log in</option><option value="profile.html">Profile</option><option value="contact.html">Contact</option><option value="about.html">About</option><option value="planner.html">Planner</option></select></label><button type="button" data-width="320" aria-pressed="false">320 px</button><button type="button" data-width="375" aria-pressed="true">375 px</button><button type="button" data-width="768" aria-pressed="false">768 px</button><button type="button" data-width="1280" aria-pressed="false">1280 px</button><span id="frameWidth" role="status">375 px viewport</span></header><iframe id="responsiveFrame" title="67Films responsive viewport" src="../index.html"></iframe><script>const frame=document.getElementById('responsiveFrame');document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{frame.style.width=button.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));document.getElementById('frameWidth').textContent=button.dataset.width+' px viewport';}));document.getElementById('testPage').addEventListener('change',event=>{frame.src='../'+event.target.value;});</script></body></html>
